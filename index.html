<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MVBD STUDIO</title>
<style>
:root{--bg:#06100c;--c1:rgba(255,255,255,.045);--ln:rgba(255,255,255,.09);--tx:#eaf3ee;--mu:#7f9a8d;--lime:#c4f542;--g:#2fdc6b;--red:#ff4d6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;max-width:100%;background:var(--bg)}
body{margin:0;color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 55% -5%,rgba(47,220,107,.22),transparent 60%),radial-gradient(600px 400px at 0 100%,rgba(196,245,66,.08),transparent 60%),var(--bg);min-height:100vh;background-attachment:fixed;overflow-x:hidden;max-width:100vw}
.app{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;max-width:1280px;margin:0 auto;padding:16px}
.card{min-width:0;max-width:100%;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:20px;padding:16px;backdrop-filter:blur(8px);animation:in .6s cubic-bezier(.2,.9,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.side{min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;align-self:start}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.3px;padding:4px 6px}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--lime),var(--g));display:grid;place-items:center;color:#06100c;font-style:normal;font-weight:900}
.nav{display:flex;flex-direction:column;gap:4px;padding:10px}
.nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:12px;color:var(--mu);font-weight:600;transition:.25s}
.nav button:hover{color:var(--tx);background:var(--c1)}
.nav button.on{color:var(--tx);background:linear-gradient(90deg,rgba(196,245,66,.2),rgba(47,220,107,.06));box-shadow:inset 0 0 0 1px rgba(196,245,66,.25)}
.main{display:grid;gap:16px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-areas:"hd hd" "sl sl" "st st" "ch up" "ps cm";min-width:0}
.hd{grid-area:hd;display:flex;align-items:center;gap:12px;padding:12px 16px}
.hd img{width:50px;height:50px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--lime),0 0 22px rgba(196,245,66,.35)}
.hd b{font-size:18px;display:block}.vf{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#3b9cff;color:#fff;font-size:11px;vertical-align:2px;margin-left:4px;box-shadow:0 0 12px rgba(59,156,255,.6)}.hd small{color:var(--mu)}.live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--g);font-weight:700;font-size:12px}
.live u{width:8px;height:8px;border-radius:50%;background:var(--g);animation:pl 1.6s infinite}@keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,220,107,.7)}100%{box-shadow:0 0 0 10px transparent}}
.st{grid-area:st;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.st .card{padding:14px;animation-delay:calc(var(--i)*.08s)}
.st small{color:var(--mu);display:flex;justify-content:space-between}.st b{font-size:26px;display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.sl{grid-area:sl}.ch{grid-area:ch}.up{grid-area:up}.ps{grid-area:ps}.cm{grid-area:cm}
h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}h3 span{color:var(--mu);font-size:12px;font-weight:500}
.cw{position:relative;height:230px}.cw svg{width:100%;height:100%;display:block}
.tip{position:absolute;transform:translate(-50%,-135%);background:rgba(20,40,30,.95);border:1px solid rgba(196,245,66,.35);padding:6px 11px;border-radius:10px;font-weight:700;pointer-events:none;white-space:nowrap;transition:left .2s,top .2s;box-shadow:0 0 18px rgba(47,220,107,.3)}
.tip small{display:block;color:var(--mu);font-weight:500}
input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px 13px;font:inherit;outline:none;transition:.25s}
input:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(196,245,66,.14)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;font-weight:800;border-radius:12px;padding:12px;transition:.2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.lime{display:block;width:100%;background:var(--lime);color:#06100c;margin-top:12px;font-size:15px;box-shadow:0 6px 24px rgba(196,245,66,.28)}
.lime:disabled,.lime[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.lime.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);animation:sh 1s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.gh{background:var(--c1);border:1px solid var(--ln);padding:9px 14px}
.row{display:flex;gap:8px}
.prev{display:none;gap:12px;margin-top:12px;background:rgba(255,255,255,.04);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.prev.on{display:flex;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.prev img{width:92px;object-fit:cover}.prev div{padding:10px 10px 10px 0;min-width:0}.prev p{margin:0 0 6px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;background:rgba(196,245,66,.16);color:var(--lime)}.tag.v{background:rgba(96,165,250,.18);color:#7db4ff}
.steps{display:none;margin-top:12px}.steps.on{display:block}
.stp{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--mu);transition:.3s}
.stp i{width:21px;height:21px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:12px;color:#06100c;transition:.3s}
.stp.now{color:var(--tx)}.stp.now i{border-color:var(--lime);border-top-color:transparent;animation:sp .7s linear infinite}
.stp.ok{color:var(--tx)}.stp.ok i{background:var(--lime);border-color:var(--lime);animation:tk .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes tk{from{transform:scale(.3)}to{transform:none}}
.bar{height:5px;background:var(--ln);border-radius:5px;margin-top:8px;overflow:hidden}.bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--lime));transition:width .5s}
.it{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);animation:in .5s both;animation-delay:calc(var(--i)*.05s);transition:.35s}
.it:first-of-type{border-top:0}.it.out{opacity:0;transform:translateX(40px)}
.it img.th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#000;flex-shrink:0}
.tx{flex:1;min-width:0}.tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}.tx small{color:var(--mu)}
.ch2{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--c1);border:1px solid var(--ln);transition:.2s}
.chip:hover{border-color:var(--lime);color:var(--lime)}.chip.d:hover{border-color:var(--red);color:var(--red)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#1b2b23}
.empty{text-align:center;color:var(--mu);padding:20px 0}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(5px)}.ov.on{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.md{width:min(520px,100%);max-height:86vh;display:flex;flex-direction:column;background:#0c1a14;border:1px solid var(--ln);border-radius:24px 24px 0 0;animation:sl .45s cubic-bezier(.2,1,.3,1)}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln)}.tabs button{all:unset;cursor:pointer;padding:9px 14px;color:var(--mu);font-weight:700;border-bottom:2px solid transparent}.tabs button.on{color:var(--lime);border-color:var(--lime)}
.mb{overflow:auto;padding:6px 16px 16px}
.cmt{display:flex;gap:10px;padding:10px 0;animation:in .4s both}.cmt.rp{margin-left:44px}
.bub{background:var(--c1);border-radius:14px;padding:8px 12px;min-width:0}.bub b{display:block;font-size:13px}.bub p{margin:2px 0 0;word-break:break-word}
.me{border:1px solid rgba(196,245,66,.3)}
.rpl{display:flex;gap:8px;margin:6px 0 0 46px;animation:pop .35s both}.rpl input{padding:9px 12px}.rpl .btn{padding:9px 14px;background:var(--lime);color:#06100c}
.rx{margin-left:auto;font-size:20px}
.ok{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}.ok.on{display:grid}
.ok div{background:#0c1a14;border:1px solid rgba(196,245,66,.3);border-radius:24px;padding:28px 38px;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 60px rgba(47,220,107,.25)}
.ok svg{width:78px;height:78px}.ok circle,.ok path{fill:none;stroke:var(--lime);stroke-linecap:round;stroke-linejoin:round}.ok circle{stroke-width:3;stroke-dasharray:166;stroke-dashoffset:166;animation:dr .6s forwards}.ok path{stroke-width:5;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.ok h3{justify-content:center;margin:10px 0 2px}.ok p{margin:0;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--red);color:#fff;padding:11px 18px;border-radius:30px;font-weight:700;opacity:0;transition:.4s;z-index:40;max-width:90%;text-align:center}.toast.on{transform:translate(-50%,0);opacity:1}
.ld{position:relative;height:104px;border-radius:18px;overflow:hidden;background:#07110c;border:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.ld canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lt{position:relative;z-index:1;min-width:0;text-shadow:0 1px 10px rgba(0,0,0,.7)}.lt b{display:block;font-size:14px;letter-spacing:.6px;font-weight:800}.lt small{display:block;font-size:9px;letter-spacing:2px;color:#9fb8aa;margin-top:3px}
.lp{position:relative;z-index:1;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.logs{margin-top:10px;max-height:132px;overflow:auto;background:#050c08;border:1px solid var(--ln);border-radius:14px;padding:10px 12px;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8fb09e}
.logs div{animation:in .3s both;word-break:break-word}.logs i{font-style:normal;color:#4f6c5d;margin-right:8px}
.logs .ok{color:var(--g)}.logs .warn{color:var(--lime)}.logs .err{color:var(--red)}

.sl{padding:14px 16px}
.selb{display:flex!important;align-items:center;gap:10px;width:100%;background:var(--c1);border:1px solid var(--ln);padding:9px 12px;border-radius:14px}
.selb b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.selb i{font-style:normal;color:var(--mu);transition:.25s}.selb.on i{transform:rotate(180deg)}
.selb:hover,.selb.on{border-color:var(--lime)}
.sll{display:none;margin-top:8px;border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18)}.sll.on{display:block;animation:pop .3s both}
.so{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-top:1px solid var(--ln);transition:.2s}.so:first-child{border-top:0}.so:hover{background:var(--c1)}
.so.cu{background:linear-gradient(90deg,rgba(196,245,66,.16),transparent)}
.so b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.so em{font-style:normal;color:var(--lime);font-weight:800}
.so .dx{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;color:var(--mu);background:var(--c1)}.so .dx:hover{color:var(--red)}
.so.add{color:var(--lime);font-weight:800}
.adc{display:none;margin-top:8px;gap:8px;flex-direction:column;border:1px dashed rgba(196,245,66,.35);border-radius:14px;padding:12px}.adc.on{display:flex;animation:pop .3s both}
.adc .pv{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px}
.adc .btn.lime{margin-top:0}
.sb{margin-bottom:12px}
.rgs,.lgd{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip.on{border-color:var(--lime);color:var(--lime);background:rgba(196,245,66,.12)}
.lgd .chip{display:inline-flex;align-items:center;gap:6px}.lgd .chip i{width:9px;height:9px;border-radius:50%;display:block}.lgd .chip.off{opacity:.4;text-decoration:line-through}
.xl{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-top:4px;padding:0 2px}
.tip div{display:flex;gap:6px;align-items:center;font-weight:700}.tip div i{width:8px;height:8px;border-radius:50%;display:block}
mark{background:rgba(196,245,66,.28);color:var(--lime);border-radius:4px;padding:0 2px}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr);padding:10px}.side{position:static;flex-direction:row;align-items:center;overflow:auto}.nav{flex-direction:row;padding:6px}.nav button{white-space:nowrap;padding:9px 12px}.brand span{display:none}
.main{grid-template-columns:minmax(0,1fr);grid-template-areas:"hd" "sl" "st" "up" "ch" "ps" "cm"}.st{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const app=initializeApp({apiKey:"AIzaSyBtBaUSIlXwJDWytaiOfal3ha7OmZEwuYM",authDomain:"mvbdminiapp.firebaseapp.com",projectId:"mvbdminiapp",storageBucket:"mvbdminiapp.firebasestorage.app",messagingSenderId:"668051748254",appId:"1:668051748254:web:d4804b68429d853a0c928f"});
const auth=getAuth(app),db=getFirestore(app);
const ME="mvbdstudio",NAME="MVBD STUDIO",PFP="https://i.postimg.cc/cJdK6tP8/IMG-20261101-130001-871.jpg";
const RX={like:"👍",love:"❤️",care:"🥰",haha:"😂",wow:"😮",sad:"😢",angry:"😡"};
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));

let posts=[],info=null,title="",busy=false,cur=null,tab="r",replyId=null;
$("pf").src=PFP;
/* ---- channels ---- */
const DEF={id:"mvbd",name:NAME,avatar:PFP,def:true};
const fb=n=>"https://ui-avatars.com/api/?background=16a34a&color=fff&name="+encodeURIComponent(n||"C");
const fixImg=(img,n)=>{img.onerror=()=>{img.onerror=null;img.src=fb(n)}};

let CH=[DEF],selId="mvbd";
const curCh=()=>CH.find(c=>c.id===selId)||DEF;
function drawCh(){const c=curCh();
 $("sa").src=c.avatar;fixImg($("sa"),c.name);$("sn").textContent=c.name;
 $("pf").src=c.avatar;fixImg($("pf"),c.name);$("hn").textContent=c.name;

 L.rows.forEach((r,i)=>{if(Math.random()<.05)r.t=Math.random();r.v+=(r.t-r.v)*.18;
  let len=p>=1?W:p*W+(r.v-.4)*sp;if(p<.02)len=3+r.v*10;len=Math.min(W,Math.max(2,len));
  const g=c.createLinearGradient(0,0,len,0);g.addColorStop(0,"rgba(8,64,34,"+r.a+")");g.addColorStop(.55,"rgba(47,220,107,"+r.a+")");g.addColorStop(.9,"rgba(196,245,66,"+r.a+")");g.addColorStop(1,"rgba(240,255,200,"+r.a+")");

  if(replyId===c.id){const r=document.createElement("div");r.className="rpl";r.innerHTML='<input placeholder="'+esc(p.authorName||NAME)+' হিসেবে reply..."><button class="btn">পাঠাও</button>';mb.appendChild(r);const inp=r.querySelector("input");setTimeout(()=>inp.focus(),50);

    try{if(!auth.currentUser){try{await signInAnonymously(auth)}catch(x){}}const ref=doc(db,"posts",p.id),cur2=(await getDoc(ref)).data().comments||[];

     await updateDoc(ref,{comments:cur2});replyId=null;await success("Reply পাঠানো হয়েছে!",(p.authorName||NAME)+" হিসেবে");}catch(x){toast("Reply যায়নি");r.querySelector(".btn").textContent="পাঠাও"}};
   r.querySelector(".btn").onclick=send;inp.onkeydown=ev=>{if(ev.key==="Enter")send()}}};
 top.forEach(c=>{row(c,false);cs.filter(r=>r.parentId===c.id).forEach(r=>row(r,true))});mb.scrollTop=keep}
